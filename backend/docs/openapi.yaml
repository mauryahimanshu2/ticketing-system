openapi: 3.1.0
info:
  title: Ticketing System API
  version: 1.0.0
  summary: REST API for customer support ticket management
  description: |
    Complete contract for authentication, tickets, agents, users, categories,
    SLA policies, audit logs, and email integration.

    **Authentication:** protected application routes expect an access JWT in
    `Authorization: Bearer <accessToken>`. Refresh tokens are sent in JSON bodies.

    **Roles:** `user` is a customer, `agent` handles assigned tickets, and `admin`
    manages the system. Each operation states its allowed roles.

    **Errors:** all handled errors return `{ "error": "message" }`. A blocked ticket
    returns HTTP 423 when a caller attempts a forbidden update.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Tickets
  - name: Admin tickets
  - name: Agents
  - name: Users
  - name: Categories
  - name: SLA policies
  - name: Audit logs
  - name: Email

paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API process is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Start customer registration
      description: Queues a six-digit email verification code. Only customer (`user`) accounts can self-register.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
            example:
              name: Alex Customer
              email: alex@example.com
              phone: '+919876543210'
              password: StrongPass123!
      responses:
        '202':
          description: Verification email accepted for background delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedEmailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/auth/verify-registration-otp:
    post:
      tags: [Authentication]
      summary: Verify registration and create customer
      operationId: verifyRegistrationOtp
      security: []
      requestBody: { $ref: '#/components/requestBodies/OtpInput' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/login-password:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      description: Available to verified, unblocked users, agents, and admins.
      operationId: loginWithPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/login-otp:
    post:
      tags: [Authentication]
      summary: Request a customer login OTP
      description: Looks up the email first and sends an OTP only for a verified, active customer account. Staff, blocked, unverified, and unknown emails are rejected without storing or sending an OTP.
      operationId: requestLoginOtp
      security: []
      requestBody: { $ref: '#/components/requestBodies/EmailInput' }
      responses:
        '202':
          description: Login OTP accepted for background delivery
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: A login verification code has been queued for this customer account.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/auth/verify-login-otp:
    post:
      tags: [Authentication]
      summary: Log a customer in with an OTP
      operationId: verifyLoginOtp
      security: []
      requestBody: { $ref: '#/components/requestBodies/OtpInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      description: Returns a new access/refresh token pair and invalidates the submitted refresh token.
      operationId: refreshTokens
      security: []
      requestBody: { $ref: '#/components/requestBodies/RefreshTokenInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the refresh-token session
      operationId: logout
      security: []
      requestBody: { $ref: '#/components/requestBodies/RefreshTokenInput' }
      responses:
        '200': { $ref: '#/components/responses/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Log out every session for the current account
      operationId: logoutAll
      responses:
        '200': { $ref: '#/components/responses/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a customer password-reset OTP
      description: Returns a neutral response. Self-service password reset is customer-only.
      operationId: forgotPassword
      security: []
      requestBody: { $ref: '#/components/requestBodies/EmailInput' }
      responses:
        '202': { $ref: '#/components/responses/NeutralEmailQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a customer password with an OTP
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200': { $ref: '#/components/responses/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/tickets:
    get:
      tags: [Tickets]
      summary: List tickets visible to the current actor
      description: "Roles: user (own tickets), agent (assigned tickets), admin (all tickets)."
      operationId: listTickets
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/TicketStatus' }
        - { $ref: '#/components/parameters/TicketPriority' }
      responses:
        '200': { $ref: '#/components/responses/TicketPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tickets]
      summary: Create a customer ticket
      description: "Role: user. Category is required; priority defaults to medium."
      operationId: createCustomerTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerTicketInput' }
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tickets/summary:
    get:
      tags: [Tickets]
      summary: Get status counts for visible tickets
      description: "Roles: user, agent, admin. Counts follow the same visibility scope as the ticket list."
      operationId: getTicketSummary
      responses:
        '200':
          description: Ticket counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: Get a visible ticket with history
      description: Customers receive public history only; agents/admins can see internal history.
      operationId: getTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      responses:
        '200':
          description: Ticket, messages, and activities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tickets/{ticketId}/messages:
    post:
      tags: [Tickets]
      summary: Reply to a ticket
      description: "Roles: user, agent, admin. Customers cannot create internal notes. Closed or blocked tickets reject replies."
      operationId: replyToTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketReplyInput' }
      responses:
        '201':
          description: Reply stored and any applicable notification queued
          content:
            application/json:
              schema:
                type: object
                required: [message, emailStatus]
                properties:
                  message: { $ref: '#/components/schemas/TicketMessage' }
                  emailStatus: { $ref: '#/components/schemas/EmailStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/tickets/{ticketId}/request-information:
    post:
      tags: [Tickets]
      summary: Request more information from the customer
      description: "Roles: agent or admin. Creates a public message and queues an email."
      operationId: requestTicketInformation
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/InformationRequest' }
      responses:
        '201': { $ref: '#/components/responses/InformationRequested' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/tickets/{ticketId}/status:
    patch:
      tags: [Tickets]
      summary: Change ticket status
      description: "Roles: user, agent, admin, subject to workflow permissions. Blocked tickets cannot be changed."
      operationId: changeTicketStatus
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/tickets/{ticketId}/priority:
    patch:
      tags: [Tickets]
      summary: Change ticket priority
      description: "Roles: agent or admin. Blocked tickets cannot be changed."
      operationId: changeTicketPriority
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/PriorityChange' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets:
    get:
      tags: [Admin tickets]
      summary: List all tickets with admin filters
      description: "Role: admin."
      operationId: listAdminTickets
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/TicketStatus' }
        - { $ref: '#/components/parameters/TicketPriority' }
        - { $ref: '#/components/parameters/CategoryFilter' }
        - { $ref: '#/components/parameters/AssignedToFilter' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200': { $ref: '#/components/responses/TicketPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin tickets]
      summary: Create a ticket for a customer
      description: "Role: admin. requesterId is required; category is optional."
      operationId: createAdminTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTicketInput' }
      responses:
        '201': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/tickets/{ticketId}:
    get:
      tags: [Admin tickets]
      summary: Get any ticket with full history
      description: "Role: admin. Includes internal messages and activity."
      operationId: getAdminTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      responses:
        '200':
          description: Full ticket detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/tickets/{ticketId}/assign:
    patch:
      tags: [Admin tickets]
      summary: Assign an unassigned ticket
      description: "Role: admin. Ticket must be open and unblocked; agent must be active."
      operationId: assignTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId]
              properties:
                agentId: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets/{ticketId}/reassign:
    patch:
      tags: [Admin tickets]
      summary: Reassign a ticket to another agent
      description: "Role: admin. Ticket must be open and unblocked. A reason is mandatory."
      operationId: reassignTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, reason]
              properties:
                agentId: { $ref: '#/components/schemas/ObjectId' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/AssignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets/{ticketId}/status:
    patch:
      tags: [Admin tickets]
      summary: Change ticket status as admin
      description: "Role: admin. Blocked tickets cannot be changed."
      operationId: changeAdminTicketStatus
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets/{ticketId}/priority:
    patch:
      tags: [Admin tickets]
      summary: Change ticket priority as admin
      description: "Role: admin. Blocked tickets cannot be changed."
      operationId: changeAdminTicketPriority
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/PriorityChange' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets/{ticketId}/category:
    patch:
      tags: [Admin tickets]
      summary: Change or clear ticket category
      description: "Role: admin. Send category as null to clear it. Blocked tickets cannot be changed."
      operationId: changeTicketCategory
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category]
              properties:
                category:
                  oneOf:
                    - { $ref: '#/components/schemas/ObjectId' }
                    - { type: 'null' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/admin/tickets/{ticketId}/block:
    patch:
      tags: [Admin tickets]
      summary: Block ticket updates
      description: "Role: admin. A reason is required."
      operationId: blockTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/tickets/{ticketId}/unblock:
    patch:
      tags: [Admin tickets]
      summary: Unblock a ticket
      description: "Role: admin. Send an empty JSON object."
      operationId: unblockTicket
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/TicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/tickets/{ticketId}/request-information:
    post:
      tags: [Admin tickets]
      summary: Request customer information as admin
      description: "Role: admin. Alias of the protected ticket information-request operation."
      operationId: requestTicketInformationAsAdmin
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody: { $ref: '#/components/requestBodies/InformationRequest' }
      responses:
        '201': { $ref: '#/components/responses/InformationRequested' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/agents:
    get:
      tags: [Agents]
      summary: List agents
      description: "Role: admin."
      operationId: listAgents
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Blocked' }
        - { $ref: '#/components/parameters/Active' }
      responses:
        '200': { $ref: '#/components/responses/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Agents]
      summary: Create an agent
      description: "Role: admin. The agent is created verified and can log in with the supplied password."
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreateInput' }
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/agents/{agentId}:
    get:
      tags: [Agents]
      summary: Get an agent and ticket statistics
      description: "Role: admin."
      operationId: getAgent
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: Agent detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserWithTicketStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Agents]
      summary: Update an agent
      description: "Role: admin. At least one field is required. A password change revokes existing sessions."
      operationId: updateAgent
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdateInput' }
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
