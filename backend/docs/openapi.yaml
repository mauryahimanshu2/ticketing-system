  /emails:
    post:
      tags: [Email]
      summary: Enqueue an outbound email
      description: Uses the dedicated `EMAIL_API_KEY` bearer credential, not a user access JWT.
      operationId: enqueueEmail
      security: [{ emailApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundEmailInput' }
      responses:
        '200':
          description: Matching idempotent request already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedEmailResponse' }
        '202':
          description: Email accepted for background delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedEmailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /emails/inbound:
    post:
      tags: [Email]
      summary: Receive an inbound ticket reply
      description: Webhook protected by `X-Inbound-Email-Secret`. Resolves the ticket from its unique reply address.
      operationId: receiveInboundEmail
      security: [{ inboundEmailSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundEmailInput' }
      responses:
        '200':
          description: Reply processed or previously processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundEmailResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by a login or refresh endpoint.
    emailApiKey:
      type: http
      scheme: bearer
      description: Dedicated EMAIL_API_KEY for outbound email enqueue requests.
    inboundEmailSecret:
      type: apiKey
      in: header
      name: X-Inbound-Email-Secret

  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Case-insensitive text search, at most 120 characters.
      schema: { type: string, maxLength: 120 }
    TicketStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/TicketStatus' }
    TicketPriority:
      name: priority
      in: query
      schema: { $ref: '#/components/schemas/Priority' }
    CategoryFilter:
      name: category
      in: query
      schema: { $ref: '#/components/schemas/ObjectId' }
    AssignedToFilter:
      name: assignedTo
      in: query
      schema: { $ref: '#/components/schemas/ObjectId' }
    FromDate:
      name: from
      in: query
      description: Inclusive lower creation-date bound.
      schema: { type: string, format: date-time }
    ToDate:
      name: to
      in: query
      description: Inclusive upper creation-date bound.
      schema: { type: string, format: date-time }
    Blocked:
      name: blocked
      in: query
      schema: { type: boolean }
    Active:
      name: active
      in: query
      description: Inverse of blocked. Do not submit conflicting active and blocked values.
      schema: { type: boolean }
    Verified:
      name: verified
      in: query
      schema: { type: boolean }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    SlaId:
      name: slaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }

  requestBodies:
    EmailInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, format: email, maxLength: 254 }
    OtpInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, otp]
            properties:
              email: { type: string, format: email, maxLength: 254 }
              otp: { type: string, pattern: '^\\d{6}$', example: '123456' }
    RefreshTokenInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken: { type: string, minLength: 40, maxLength: 200 }
    StatusChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: { $ref: '#/components/schemas/TicketStatus' }
    PriorityChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [priority]
            properties:
              priority: { $ref: '#/components/schemas/Priority' }
    InformationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string, minLength: 1, maxLength: 20000 }
    ReasonInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500 }
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0

  responses:
    BadRequest:
      description: Request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Credential is missing or invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated actor is not allowed to perform this operation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Requested resource was not found or is outside the actor's visibility scope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Request conflicts with current resource state or unique data
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Locked:
      description: Account or ticket is locked/blocked for this operation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Rate or OTP-attempt limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: A required service or configuration is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AuthSuccess:
      description: Authentication succeeded
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } }
    MessageResponse:
      description: Operation completed
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties: { message: { type: string } }
    NeutralEmailQueued:
      description: Request accepted without revealing whether the account exists
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties: { message: { type: string } }
    TicketResponse:
      description: Ticket state after the operation
      content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } }
    TicketPage:
      description: Paginated tickets
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Pagination' }
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
    AssignmentResponse:
      description: Assignment changed and notifications processed
      content:
        application/json:
          schema:
            type: object
            required: [ticket, notificationsQueued, notificationCount]
            properties:
              ticket: { $ref: '#/components/schemas/Ticket' }
              notificationsQueued: { type: boolean }
              notificationCount: { type: integer, minimum: 0 }
    InformationRequested:
      description: Information request stored and notification processed
      content:
        application/json:
          schema:
            type: object
            required: [ticket, message, emailStatus]
            properties:
              ticket: { $ref: '#/components/schemas/Ticket' }
              message: { $ref: '#/components/schemas/TicketMessage' }
              emailStatus: { $ref: '#/components/schemas/EmailStatus' }
    UserResponse:
      description: User state after the operation
      content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
    UserPage:
      description: Paginated users
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Pagination' }
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserWithTicketStats' } }
    CategoryResponse:
      description: Category
      content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
    CategoryPage:
      description: Paginated categories
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Pagination' }
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Category' } }
    SlaResponse:
      description: SLA policy
      content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } }
    SlaPage:
      description: Paginated SLA policies
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Pagination' }
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SlaPolicy' } }
    AuditPage:
      description: Paginated audit logs
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Pagination' }
              - type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: 507f1f77bcf86cd799439011
    DateTime:
      type: string
      format: date-time
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    TicketStatus:
      type: string
      enum: [open, in_progress, pending, resolved, closed]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, example: A valid ticketId is required }
    Pagination:
      type: object
      required: [items, page, limit, total, pages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 0 }
    UserSummary:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, agent, admin] }
        isBlocked: { type: boolean }
    User:
      type: object
      required: [_id, name, email, role, isVerified, isBlocked, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, example: '+919876543210' }
        role: { type: string, enum: [user, agent, admin] }
        isVerified: { type: boolean }
        isBlocked: { type: boolean }
        blockedAt:
          oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }]
        blockReason:
          oneOf: [{ type: string, maxLength: 500 }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    UserWithTicketStats:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            ticketStats:
              type: object
              required: [total, open]
              properties:
                total: { type: integer, minimum: 0 }
                open: { type: integer, minimum: 0 }
    RegistrationInput:
      type: object
      additionalProperties: false
      required: [name, email, phone, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^\\+[1-9]\\d{6,14}$' }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
    PasswordLoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72, writeOnly: true }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [email, otp, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        otp: { type: string, pattern: '^\\d{6}$' }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
    AuthResult:
      type: object
      required: [accessToken, refreshToken, tokenType, refreshExpiresAt, user]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        tokenType: { type: string, const: Bearer }
        refreshExpiresAt: { $ref: '#/components/schemas/DateTime' }
        user: { $ref: '#/components/schemas/User' }
    CustomerTicketInput:
      type: object
      additionalProperties: false
      required: [subject, description, category]
      properties:
        subject: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        category: { $ref: '#/components/schemas/ObjectId' }
    AdminTicketInput:
      type: object
      additionalProperties: false
      required: [subject, description, requesterId]
      properties:
        subject: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        requesterId: { $ref: '#/components/schemas/ObjectId' }
        category: { $ref: '#/components/schemas/ObjectId' }
        priority: { $ref: '#/components/schemas/Priority' }
    SlaSnapshot:
      type: object
      properties:
        policyId:
          oneOf: [{ $ref: '#/components/schemas/ObjectId' }, { type: 'null' }]
        policyName:
          oneOf: [{ type: string }, { type: 'null' }]
        priority: { $ref: '#/components/schemas/Priority' }
        firstResponseMinutes: { type: integer, minimum: 0 }
        resolutionMinutes: { type: integer, minimum: 0 }
        appliedAt: { $ref: '#/components/schemas/DateTime' }
    Ticket:
      type: object
      required: [_id, ticketNumber, subject, description, requesterId, requesterEmail, priority, status, isBlocked, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        ticketNumber: { type: string, example: TKT-ABC123 }
        subject: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        requesterId:
          oneOf: [{ $ref: '#/components/schemas/ObjectId' }, { $ref: '#/components/schemas/UserSummary' }]
        requesterEmail: { type: string, format: email }
        assignedTo:
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        assignedBy:
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        assignedAt:
          oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }]
        category:
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/Category' }
            - { type: 'null' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/TicketStatus' }
        emailReplyAddress: { type: string, format: email }
        lastMessageAt: { $ref: '#/components/schemas/DateTime' }
        resolvedAt: { $ref: '#/components/schemas/DateTime' }
        closedAt: { $ref: '#/components/schemas/DateTime' }
        isBlocked: { type: boolean }
        blockedAt:
          oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }]
        blockReason:
          oneOf: [{ type: string, maxLength: 500 }, { type: 'null' }]
        slaSnapshot: { $ref: '#/components/schemas/SlaSnapshot' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    TicketReplyInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        type:
          type: string
          enum: [public, internal]
          default: public
          description: Internal messages are limited to agents/admins and are never emailed to customers.
    TicketMessage:
      type: object
      required: [_id, ticketId, senderEmail, senderRole, type, body, source, createdAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        ticketId: { $ref: '#/components/schemas/ObjectId' }
        senderId:
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        senderEmail: { type: string, format: email }
        senderRole: { type: string, enum: [user, agent, admin, external, system] }
        type: { type: string, enum: [public, internal] }
        body: { type: string }
        source: { type: string, enum: [web, email] }
        emailMessageId: { type: string }
        emailInReplyTo: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    TicketActivity:
      type: object
      required: [_id, ticketId, action, createdAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        ticketId: { $ref: '#/components/schemas/ObjectId' }
        actorId:
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        action:
          type: string
          enum: [ticket_created, status_changed, assignment_changed, priority_changed, category_changed, customer_reply, agent_reply, information_requested, resolved, closed, reopened, ticket_blocked, ticket_unblocked]
        oldValue: {}
        newValue: {}
        metadata: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    TicketDetail:
      allOf:
        - { $ref: '#/components/schemas/Ticket' }
        - type: object
          required: [messages, activities]
          properties:
            messages: { type: array, items: { $ref: '#/components/schemas/TicketMessage' } }
            activities: { type: array, items: { $ref: '#/components/schemas/TicketActivity' } }
    TicketSummary:
      type: object
      required: [open, pending, in_progress, resolved, closed, reopened, total]
      properties:
        open: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        in_progress: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }
        reopened: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    EmailStatus:
      type: object
      additionalProperties: true
      description: Notification queue result; exact fields depend on whether an email was applicable and queued.
    AgentCreateInput:
      allOf:
        - { $ref: '#/components/schemas/RegistrationInput' }
    AgentUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^\\+[1-9]\\d{6,14}$' }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        isActive: { type: boolean, default: true }
    CategoryUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        isActive: { type: boolean }
    Category:
      type: object
      required: [_id, name, isActive, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        isActive: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    SlaPolicyInput:
      type: object
      additionalProperties: false
      required: [name, priority, firstResponseMinutes, resolutionMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { $ref: '#/components/schemas/Priority' }
        firstResponseMinutes: { type: integer, minimum: 1, maximum: 525600 }
        resolutionMinutes: { type: integer, minimum: 1, maximum: 525600 }
        isActive: { type: boolean, default: true }
    SlaPolicyUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { $ref: '#/components/schemas/Priority' }
        firstResponseMinutes: { type: integer, minimum: 1, maximum: 525600 }
        resolutionMinutes: { type: integer, minimum: 1, maximum: 525600 }
        isActive: { type: boolean }
    SlaPolicy:
      type: object
      required: [_id, name, priority, firstResponseMinutes, resolutionMinutes, isActive, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, maxLength: 120 }
        priority: { $ref: '#/components/schemas/Priority' }
        firstResponseMinutes: { type: integer, minimum: 1 }
        resolutionMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    AuditLog:
      type: object
      required: [_id, actorId, actorRole, action, targetType, targetId, createdAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        actorId:
          oneOf: [{ $ref: '#/components/schemas/ObjectId' }, { $ref: '#/components/schemas/UserSummary' }]
        actorRole: { type: string, const: admin }
        action: { type: string, maxLength: 120 }
        targetType: { type: string, maxLength: 80 }
        targetId: { $ref: '#/components/schemas/ObjectId' }
        details: { type: object, additionalProperties: true }
        ipAddress: { type: string, maxLength: 64 }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    QueuedEmailResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [queued, duplicate, accepted] }
        jobId: { type: string }
        message: { type: string }
    OutboundEmailInput:
      type: object
      required: [recipient, subject, emailType]
      properties:
        recipient: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 500 }
        text: { type: string, maxLength: 1000000 }
        html: { type: string, maxLength: 1000000 }
        replyTo: { type: string, format: email }
        emailType:
          type: string
          enum: [otp, welcome, ticket_created, ticket_reply, ticket_assigned, ticket_status_update, ticket_information_request, ticket_notification, password_reset]
        ticketId: { $ref: '#/components/schemas/ObjectId' }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        ticketMessageType:
          type: string
          enum: [public]
          description: Required and must be public when emailType is ticket_reply.
      anyOf:
        - required: [text]
        - required: [html]
    InboundEmailInput:
      type: object
      additionalProperties: false
      required: [recipient, sender, messageId, body]
      properties:
        recipient: { type: string, format: email, maxLength: 254 }
        sender: { type: string, format: email, maxLength: 254 }
        messageId: { type: string, minLength: 1, maxLength: 500 }
        inReplyTo: { type: string, maxLength: 500 }
        body: { type: string, minLength: 1, maxLength: 20000 }
    InboundEmailResult:
      type: object
      required: [status, ticketId]
      properties:
        status: { type: string, enum: [processed, duplicate] }
        ticketId: { $ref: '#/components/schemas/ObjectId' }
        messageId: { $ref: '#/components/schemas/ObjectId' }

security:
  - bearerAuth: []
